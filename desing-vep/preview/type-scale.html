<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: white; padding: 24px 28px; }
  .row { display: flex; flex-direction: column; gap: 14px; }
  .item { display: flex; align-items: baseline; gap: 14px; }
  .meta { font-size: 10px; color: #aaa; font-family: monospace; min-width: 100px; flex-shrink: 0; }
  .divider { height: 1px; background: #f0f0f0; margin: 4px 0; }
</style>
</head>
<body>
<div class="row">
  <div class="item">
    <div class="meta">24px / bold</div>
    <div style="font-size:24px; font-weight:700; color:#171717; letter-spacing:-0.01em; line-height:1.3;">Título de Página</div>
  </div>
  <div class="divider"></div>
  <div class="item">
    <div class="meta">20px / bold</div>
    <div style="font-size:20px; font-weight:700; color:#171717; letter-spacing:-0.01em;">Seção Principal</div>
  </div>
  <div class="item">
    <div class="meta">16px / semibold</div>
    <div style="font-size:16px; font-weight:600; color:#171717;">Título de Card</div>
  </div>
  <div class="item">
    <div class="meta">14px / medium</div>
    <div style="font-size:14px; font-weight:500; color:#171717;">Label de Campo</div>
  </div>
  <div class="item">
    <div class="meta">14px / regular</div>
    <div style="font-size:14px; font-weight:400; color:#333;">Texto do corpo principal da aplicação</div>
  </div>
  <div class="item">
    <div class="meta">12px / regular</div>
    <div style="font-size:12px; font-weight:400; color:#888;">Subtítulo muted — 47 lançamentos</div>
  </div>
  <div class="divider"></div>
  <div class="item">
    <div class="meta">24px / bold mono</div>
    <div style="font-family:'Inter',monospace; font-size:24px; font-weight:700; font-variant-numeric:tabular-nums; color:#171717; letter-spacing:-0.02em;">R$ 4.289,50</div>
  </div>
  <div class="item">
    <div class="meta">14px / mono</div>
    <div style="font-family:'Inter',monospace; font-size:14px; font-variant-numeric:tabular-nums; color:#171717;">+R$ 850,00 · −R$ 120,00</div>
  </div>
</div>
</body>
</html>
