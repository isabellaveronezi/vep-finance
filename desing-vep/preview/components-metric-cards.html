<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #f9fafb; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .card { background: white; border: 1px solid #e5e7eb; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .card-top { display: flex; align-items: center; justify-content: space-between; }
  .card-label { font-size: 12px; color: #888; }
  .icon-badge { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
  .card-value { font-family: 'Inter', monospace; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .card-sub { font-size: 11px; color: #888; margin-top: 2px; }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="grid">
  <div class="card">
    <div class="card-top">
      <span class="card-label">Receitas</span>
      <div class="icon-badge" style="background:#d1fae5;color:#10b981;">
        <svg viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
      </div>
    </div>
    <div>
      <div class="card-value" style="color:#171717;">R$ 6.800,00</div>
      <div class="card-sub">entradas recebidas no mês</div>
    </div>
  </div>
  <div class="card">
    <div class="card-top">
      <span class="card-label">Despesas</span>
      <div class="icon-badge" style="background:#fee2e2;color:#ef4444;">
        <svg viewBox="0 0 24 24"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg>
      </div>
    </div>
    <div>
      <div class="card-value" style="color:#171717;">R$ 4.289,50</div>
      <div class="card-sub">R$ 3.100,00 já pago</div>
    </div>
  </div>
  <div class="card">
    <div class="card-top">
      <span class="card-label">Saldo</span>
      <div class="icon-badge" style="background:#dbeafe;color:#3b82f6;">
        <svg viewBox="0 0 24 24"><path d="M20 12V22H4V12"/><path d="M22 7H2v5h20V7z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
      </div>
    </div>
    <div>
      <div class="card-value" style="color:#171717;">R$ 2.510,50</div>
      <div class="card-sub">você está no positivo</div>
    </div>
  </div>
  <div class="card">
    <div class="card-top">
      <span class="card-label">Gasto / dia</span>
      <div class="icon-badge" style="background:#ede9fe;color:#8b5cf6;">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </div>
    </div>
    <div>
      <div class="card-value" style="color:#171717;">R$ 142,98</div>
      <div class="card-sub">11 dias restantes no mês</div>
    </div>
  </div>
</div>
</body>
</html>
