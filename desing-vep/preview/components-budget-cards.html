<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #f9fafb; padding: 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .card { background: white; border: 1px solid #e5e7eb; border-radius: 14px; padding: 14px; }
  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .icon-cat { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .cat-name { font-size: 13px; font-weight: 500; }
  .cat-limit { font-size: 11px; color: #888; }
  .bar-track { height: 8px; border-radius: 9999px; background: #f4f4f5; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 9999px; transition: width 0.3s; }
  .card-foot { display: flex; justify-content: space-between; font-size: 11px; color: #888; margin-top: 8px; }
  .card-foot strong { color: #171717; }
</style>
</head>
<body>
<div class="grid">
  <div class="card">
    <div class="card-head">
      <div class="icon-cat" style="background:#fef3c7;">🛒</div>
      <div><div class="cat-name">Alimentação</div><div class="cat-limit">Limite: R$ 1.200,00</div></div>
    </div>
    <div class="bar-track"><div class="bar-fill" style="width:44%;background:#10b981;"></div></div>
    <div class="card-foot"><span>Gasto: <strong>R$ 528,00</strong></span><span>Restante: <strong>R$ 672,00</strong></span><span style="color:#10b981;font-weight:600;">44%</span></div>
  </div>
  <div class="card">
    <div class="card-head">
      <div class="icon-cat" style="background:#dbeafe;">🚗</div>
      <div><div class="cat-name">Transporte</div><div class="cat-limit">Limite: R$ 400,00</div></div>
    </div>
    <div class="bar-track"><div class="bar-fill" style="width:72%;background:#eab308;"></div></div>
    <div class="card-foot"><span>Gasto: <strong>R$ 288,00</strong></span><span>Restante: <strong>R$ 112,00</strong></span><span style="color:#eab308;font-weight:600;">72%</span></div>
  </div>
  <div class="card">
    <div class="card-head">
      <div class="icon-cat" style="background:#ede9fe;">🎬</div>
      <div><div class="cat-name">Lazer</div><div class="cat-limit">Limite: R$ 300,00</div></div>
    </div>
    <div class="bar-track"><div class="bar-fill" style="width:87%;background:#f59e0b;"></div></div>
    <div class="card-foot"><span>Gasto: <strong>R$ 261,00</strong></span><span>Restante: <strong>R$ 39,00</strong></span><span style="color:#f59e0b;font-weight:600;">87%</span></div>
  </div>
  <div class="card">
    <div class="card-head">
      <div class="icon-cat" style="background:#fee2e2;">🏠</div>
      <div><div class="cat-name">Moradia</div><div class="cat-limit">Limite: R$ 1.800,00</div></div>
    </div>
    <div class="bar-track"><div class="bar-fill" style="width:100%;background:#ef4444;"></div></div>
    <div class="card-foot"><span>Gasto: <strong>R$ 1.950,00</strong></span><span style="color:#ef4444;font-weight:600;">Excedeu R$ 150,00</span><span style="color:#ef4444;font-weight:600;">108%</span></div>
  </div>
</div>
</body>
</html>
