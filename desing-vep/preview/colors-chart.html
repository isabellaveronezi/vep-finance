<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #fafafa; padding: 20px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: flex-end; }
  .swatch { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .chip { width: 44px; height: 36px; border-radius: 6px; }
  .label { font-size: 9px; color: #999; font-family: monospace; }
  .title { font-size: 10px; color: #888; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div class="title">Paleta de Gráficos — Recharts Donut</div>
<div class="row">
  <div class="swatch"><div class="chip" style="background:#6366f1;"></div><div class="label">#6366f1</div></div>
  <div class="swatch"><div class="chip" style="background:#f59e0b;"></div><div class="label">#f59e0b</div></div>
  <div class="swatch"><div class="chip" style="background:#10b981;"></div><div class="label">#10b981</div></div>
  <div class="swatch"><div class="chip" style="background:#ef4444;"></div><div class="label">#ef4444</div></div>
  <div class="swatch"><div class="chip" style="background:#3b82f6;"></div><div class="label">#3b82f6</div></div>
  <div class="swatch"><div class="chip" style="background:#8b5cf6;"></div><div class="label">#8b5cf6</div></div>
  <div class="swatch"><div class="chip" style="background:#ec4899;"></div><div class="label">#ec4899</div></div>
  <div class="swatch"><div class="chip" style="background:#14b8a6;"></div><div class="label">#14b8a6</div></div>
  <div class="swatch"><div class="chip" style="background:#f97316;"></div><div class="label">#f97316</div></div>
  <div class="swatch"><div class="chip" style="background:#84cc16;"></div><div class="label">#84cc16</div></div>
  <div class="swatch"><div class="chip" style="background:#94a3b8;"></div><div class="label">#94a3b8 outros</div></div>
</div>
</body>
</html>
