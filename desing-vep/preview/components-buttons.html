<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: white; padding: 20px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button {
    display: inline-flex; align-items: center; gap: 6px;
    height: 36px; padding: 0 16px; border-radius: 8px;
    font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500;
    cursor: pointer; border: none; transition: opacity 0.15s;
  }
  .btn-primary { background: #171717; color: #fafafa; }
  .btn-outline { background: white; color: #171717; border: 1px solid #e5e7eb; }
  .btn-ghost { background: transparent; color: #171717; }
  .btn-ghost:hover { background: #f4f4f5; }
  .btn-destructive { background: #ef4444; color: white; }
  .btn-sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 6px; }
  .btn-icon { width: 36px; height: 36px; padding: 0; border-radius: 8px; justify-content: center; background: transparent; color: #171717; }
  .btn-icon:hover { background: #f4f4f5; }
  svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sep { width: 1px; height: 32px; background: #e5e7eb; }
</style>
</head>
<body>
<div class="row">
  <button class="btn-primary">
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Nova transação
  </button>
  <button class="btn-outline">
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Limite por categoria
  </button>
  <button class="btn-ghost">Cancelar</button>
  <button class="btn-destructive">Deletar</button>
  <div class="sep"></div>
  <button class="btn-primary btn-sm">
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Salvar
  </button>
  <button class="btn-outline btn-sm">Cancelar</button>
  <div class="sep"></div>
  <button class="btn-icon">
    <svg viewBox="0 0 24 24" style="width:16px;height:16px;"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
  </button>
  <button class="btn-icon" style="color:#ef4444;">
    <svg viewBox="0 0 24 24" style="width:16px;height:16px;"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
  </button>
</div>
</body>
</html>
