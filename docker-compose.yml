services:
  postgres:
    image: postgres:16-alpine
    container_name: fincontrol_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fincontrol
      POSTGRES_PASSWORD: fincontrol123
      POSTGRES_DB: fincontrol_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-evolution-db.sql:/docker-entrypoint-initdb.d/init-evolution-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fincontrol -d fincontrol_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: node:20-alpine
    container_name: fincontrol_app
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install -g pnpm --silent && pnpm install && pnpm dev"
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy

  evolution_api:
    image: atendai/evolution-api:latest
    container_name: fincontrol_evolution
    restart: unless-stopped
    ports:
      - '8081:8080'
    environment:
      SERVER_URL: 'http://localhost:8081'
      AUTHENTICATION_API_KEY: '119db236f07d8c8af41f6df1d60acf6191fec1f85cd6f2e5f7dd8895e5c99bca'
      DATABASE_ENABLED: 'true'
      DATABASE_PROVIDER: 'postgresql'
      DATABASE_CONNECTION_URI: 'postgresql://fincontrol:fincontrol123@postgres:5432/evolution_db'
      DATABASE_CONNECTION_CLIENT_NAME: 'evolution_v2'
      CACHE_REDIS_ENABLED: 'false'
      CACHE_LOCAL_ENABLED: 'true'
      WA_MARK_MESSAGES_READ: 'true'
      WA_REJECT_CALL: 'false'
      WEBHOOK_GLOBAL_ENABLED: 'false'
      LOG_BAILEYS: 'error'
      CONFIG_SESSION_PHONE_VERSION: '2.3000.1035194821'
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy

  adminer:
    image: adminer:latest
    container_name: fincontrol_adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  evolution_instances:
